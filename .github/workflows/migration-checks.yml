name: Migration checks

on:
  push:
    branches:
      - "refactor/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-static-audit:
    name: Baseline links and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit original HTML pages
        run: node scripts/audit-legacy.mjs
