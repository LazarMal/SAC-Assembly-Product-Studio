name: Bootstrap studio lockfile

on:
  push:
    branches: [refactor/modular-foundation]
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix apps/studio
      - name: Commit reproducible dependency graph to migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/package-lock.json
          git diff --cached --quiet || git commit -m "build: lock modular studio dependencies"
          git push origin HEAD:refactor/modular-foundation
